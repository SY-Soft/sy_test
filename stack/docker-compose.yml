name: sy_lamp

services:
  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../projects:/var/www/projects
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  php:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      TZ: Europe/Kyiv
      COMPOSER_PROCESS_TIMEOUT: "1800"
    volumes:
      - ../projects:/var/www/projects
      - laravel_cache:/var/cache/laravel
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Europe/Kyiv
    volumes:
      - ../mysql:/var/lib/mysql
    ports:
      - "3306:3306"
    command: --lower-case-table-names=1

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
    ports:
      - "8080:80"
    depends_on:
      - mysql

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  laravel_cache: